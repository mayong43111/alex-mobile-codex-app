name: Rebuild checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://packagefeedproxy.microsoft.io/npm/
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
